<script>
const KEY='studentLifeShareV1';
const defaultData={targets:[],classes:[],routine:[],goals:[],workouts:[],notes:[],folders:['General'],done:{},settings:{focus:25,theme:'dark',name:'Student'},sessions:[],plans:{}};
let d=load(); let current='home', plannerDate=todayLocal(), timer=null, timerLeft=0, timerRunning=false, pdfDB=null;
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){let legacy=JSON.parse(localStorage.getItem('studyLifeV3')||'null');if(legacy){let migrated=structuredClone(defaultData);migrated.targets=(legacy.study||[]).map((t,i)=>({id:t.id||'t-'+Date.now()+i,title:t.t||'Study task',subject:t.s||'Study',date:t.date||todayLocal(),time:t.time||'',minutes:+t.m||0,priority:'Normal'}));migrated.classes=legacy.classes||[];migrated.routine=legacy.routine||[];migrated.goals=(legacy.goals||[]).map((g,i)=>({id:g.id||'g-'+Date.now()+i,title:g.t||g.title||'Goal',date:g.date||todayLocal(),cat:g.p||g.cat||'Study',progress:g.progress||0,note:g.m||g.note||''}));migrated.workouts=legacy.workout||legacy.workouts||[];migrated.notes=legacy.notes||[];migrated.folders=legacy.noteFolders||['General'];migrated.done={};Object.keys(legacy.done||{}).forEach(k=>{if(k.startsWith('study-'))migrated.done['t-'+k.slice(6)]=legacy.done[k];else if(k.startsWith('goal-'))migrated.done['g-'+k.slice(5)]=legacy.done[k]});migrated.settings.focusMinutes=legacy.settings?.focusMinutes||25;raw=JSON.stringify(migrated);localStorage.setItem(KEY,raw)}}let x=JSON.parse(raw||'null')||structuredClone(defaultData);x=Object.assign(structuredClone(defaultData),x);x.targets=x.targets||x.study||[];x.classes=x.classes||[];x.routine=x.routine||[];x.goals=x.goals||[];x.workouts=x.workouts||x.workout||[];x.notes=x.notes||[];x.folders=x.folders||x.noteFolders||['General'];x.done=x.done||{};x.sessions=x.sessions||[];x.settings=Object.assign({},defaultData.settings,x.settings||{});x.settings.name=(x.settings.name||'Student').trim()||'Student';x.targets.forEach((t,i)=>{if(!t.id)t.id='t-'+Date.now()+i;t.start=t.start||t.time||'';t.end=t.end||((t.start&&t.minutes)?addMin(t.start,+t.minutes):'');t.time=t.start||t.time||''});x.classes.forEach((c,i)=>{if(!c.id)c.id='c-'+Date.now()+i;c.days=Array.isArray(c.days)?c.days:(c.day!=null?[+c.day]:[1,2,3,4,5]);c.start=c.start||c.time||'16:00';c.end=c.end||addMin(c.start,60)});x.routine.forEach((r,i)=>{if(!r.id)r.id='r-'+Date.now()+i;r.days=Array.isArray(r.days)?r.days:[0,1,2,3,4,5,6];r.start=r.start||r.time||'06:00';r.end=r.end||addMin(r.start,60)});x.folders=(Array.isArray(x.folders)?x.folders:[]).map(f=>typeof f==='string'?f:(f?.name||f?.title||'General')).filter(Boolean);if(!x.folders.some(f=>f.toLowerCase()==='general'))x.folders.unshift('General');x.folders=[...new Set(x.folders)];x.notes=(Array.isArray(x.notes)?x.notes:[]).map(n=>{n=n||{};if(typeof n.folder!=='string')n.folder=n.folder?.name||n.folder?.title||'General';if(typeof n.title!=='string')n.title=n.title?.name||n.title?.title||'Untitled';if(typeof n.subject!=='string')n.subject=n.subject?.name||n.subject?.title||'';if(typeof n.file!=='string'&&n.file!=null)n.file=n.file?.name||n.file?.title||'';if(!n.id)n.id='n-'+Date.now()+Math.random();return n});x.notes.forEach(n=>{n.folder=n.folder||'General'});return x}catch(e){return structuredClone(defaultData)}}
async function save(){

  // Local storage me save
  localStorage.setItem(KEY, JSON.stringify(d));

  // Supabase me save
  try {

    const { data: sessionData } =
      await supabaseClient.auth.getSession();

    const user = sessionData?.session?.user;

    // Login nahi hai to sirf local save rahega
    if (!user) {
      console.log("Supabase: user not logged in");
      return;
    }

    const { error } = await supabaseClient
      .from("study_data")
      .upsert(
        {
          user_id: user.id,
          data: d,
          updated_at: new Date().toISOString()
        },
        {
          onConflict: "user_id"
        }
      );

    if (error) {
      console.error("Supabase save error:", error);
      toast("Supabase save failed");
      return;
    }

    console.log("✅ Data saved to Supabase");

  } catch (error) {
    console.error("Supabase error:", error);
  }
}
function todayLocal(){let z=new Date();return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')}
function addMin(t,m){let [h,mi]=t.split(':').map(Number),n=h*60+mi+m; n=Math.min(1439,n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dayOf(date){return new Date(date+'T12:00:00').getDay()} function days(){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']} function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(window.toastT);window.toastT=setTimeout(()=>e.style.display='none',2300)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function isDone(type,id){return !!d.done[type+id]} function setDone(type,id,v){d.done[type+id]=v}
function streak(){let dates=new Set(d.sessions.map(s=>s.date));d.targets.filter(t=>isDone('t-',t.id)).forEach(t=>dates.add(t.completedDate||t.date));let n=0,dt=new Date();while(dates.has(dt.toISOString().slice(0,10))||dates.has(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'))){n++;dt.setDate(dt.getDate()-1)}return n}
function updateSide(){let e=document.getElementById('streakSide');if(e)e.textContent=streak()}
function go(p){current=p;window.scrollTo({top:0,behavior:'smooth'});render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));}

function timeParts(t){if(!t)return {h:'12',m:'00',p:'AM'};let [hh,mm]=t.split(':').map(Number),p=hh>=12?'PM':'AM',h=hh%12||12;return {h:String(h),m:String(mm).padStart(2,'0'),p}}
function timeField(prefix,label,value=''){let q=timeParts(value);let mins=Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(m=>`<option value="${m}" ${q.m===m?'selected':''}>${m}</option>`).join('');let hrs=Array.from({length:12},(_,i)=>String(i+1)).map(h=>`<option value="${h}" ${q.h===h?'selected':''}>${h}</option>`).join('');return `<div class="field"><label>${label}</label><div class="time-picker"><select class="select tp-hour" id="${prefix}H">${hrs}</select><span class="time-sep">:</span><select class="select tp-minute" id="${prefix}M">${mins}</select><select class="select tp-period" id="${prefix}P"><option ${q.p==='AM'?'selected':''}>AM</option><option ${q.p==='PM'?'selected':''}>PM</option></select></div></div>`}
function readTime(prefix){let h=+(document.getElementById(prefix+'H')?.value||12),m=+(document.getElementById(prefix+'M')?.value||0),p=document.getElementById(prefix+'P')?.value||'AM';if(h===12)h=0;if(p==='PM')h+=12;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function parseTimeInput(s){s=(s||'').trim().toUpperCase();if(!s)return '';let m=s.match(/^(\d{1,2})(?::(\d{1,2}))?\s*(AM|PM)?$/);if(!m)return '';let h=+m[1],mi=+(m[2]||0),p=m[3];if(mi>59)return '';if(p){if(h<1||h>12)return '';if(h===12)h=0;if(p==='PM')h+=12}else{if(h>23)return '';};return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function fmtTime(t){if(!t)return '';let q=timeParts(t);return `${+q.h}:${q.m} ${q.p}`}

function targetRow(t,compact=false){let done=isDone('t-',t.id),st=t.start||t.time||'',en=t.end||'';let range=st?(en?`${fmtTime(st)} – ${fmtTime(en)}`:fmtTime(st)):'Time not set';return `<div class="item"><div class="item-row"><button class="check ${done?'on':''}" onclick="toggleTarget('${t.id}')">${done?'✓':''}</button><div class="item-main"><div class="item-title ${done?'done':''}">${esc(t.title)} ${t.subject?`<span class="tag">${esc(t.subject)}</span>`:''} ${t.priority==='High'?'<span class="tag orange">High</span>':''}</div><div class="item-sub">${t.date} • ${range}${t.minutes?' • '+t.minutes+' min':''}</div></div><div class="actions"><button class="secondary" onclick="editTarget('${t.id}')">Edit</button>${!compact?`<button class="danger" onclick="delTarget('${t.id}')">Delete</button>`:''}</div></div></div>`}

function addTarget(){let title=v('tTitle'),subject=v('tSub'),date=v('tDate');if(!title||!date)return toast('Target and date are required');let start=readTime('tStart'),end=readTime('tEnd');let min=+v('tMin')||0;if(start==='00:00'&&end==='00:00')start='';if(end==='00:00')end='';if(start&&end&&duration(start,end)<=0)return toast('End time must be after start time');if(start&&end)min=duration(start,end);d.targets.push({id:id(),title,subject,date,start,end,time:start,minutes:min,priority:v('tPri')});save();toast('Target added');render()}

function planner(a){let dt=plannerDate,dn=dayOf(dt),targetsToday=d.targets.filter(x=>x.date===dt).sort(sortTarget),classesToday=d.classes.filter(x=>x.days.includes(dn)).map(c=>({time:c.start,title:c.subject,sub:c.name||'Live Class',mins:duration(c.start,c.end),kind:'class',id:c.id})),targetBlocks=targetsToday.map(t=>({time:t.start||t.time,title:t.title,sub:(t.subject||'Study')+(t.start&&t.end?' • '+fmtTime(t.start)+' – '+fmtTime(t.end):''),mins:t.minutes||45,kind:'target',id:t.id,done:isDone('t-',t.id)})),blocks=[...targetBlocks,...classesToday].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')),done=targetsToday.filter(x=>isDone('t-',x.id)).length,pct=targetsToday.length?Math.round(done/targetsToday.length*100):0,totalMin=targetsToday.reduce((n,x)=>n+(+x.minutes||0),0);a.innerHTML=`<div class="planner"><div class="planner-top"><div class="planner-title"><h2>Planner</h2><p>Plan your day. Stay focused. Achieve your goals.</p></div><div class="planner-controls"><input class="planner-date" type="date" value="${dt}" onchange="plannerDate=this.value;render()"><button class="secondary" onclick="plannerDate=todayLocal();render()">Today</button></div></div><div class="planner-body"><div class="planner-stats"><div class="pstat"><b>${blocks.length}</b><small>Today's blocks</small></div><div class="pstat"><b>${done}</b><small>Targets done</small></div><div class="pstat"><b>${Math.floor(totalMin/60)}h ${totalMin%60}m</b><small>Study planned</small></div><div class="pstat"><b>${targetsToday.length-done}</b><small>Pending</small></div></div><div class="planner-grid"><main class="planner-main"><div class="planner-tabs"><button class="planner-tab active">Day</button><button class="planner-tab" onclick="plannerWeek()">Week</button><button class="planner-tab" onclick="plannerMonth()">Month</button></div><div style="padding:14px 18px;color:#8294aa;font-size:13px;font-weight:800">${fmtDate(dt)}</div><div class="timeline">${blocks.map(b=>`<div class="timeline-row"><div class= function plannerWeek(){let base=new Date(plannerDate+'T12:00:00'),sun=new Date(base);sun.setDate(base.getDate()-base.getDay());let html='';for(let i=0;i<7;i++){let z=new Date(sun);z.setDate(sun.getDate()+i);let s=z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');let count=d.targets.filter(t=>t.date===s).length+d.classes.filter(c=>c.days.includes(z.getDay())).length;html+=`<div class="item"><b>${days()[i]} • ${fmtDate(s)}</b><div class="item-sub">${count} planned blocks</div><button class="secondary" onclick="plannerDate='${s}';render()">Open day</button></div>`}document.getElementById('app').innerHTML=`<div class="planner"><div class="planner-top"><div class="planner-title"><h2>Planner · Week</h2><p>Weekly overview</p></div><button class="secondary" onclick="render()">Day view</button></div><div class="planner-body"><div class="card" style="background:#0a1727">${html}</div></div></div>`}

async function deleteFolder(){
  const selected=typeof window.noteFolder==='string'?window.noteFolder.trim():'';
  if(!selected||selected==='All'||selected==='General')return toast('Select a custom folder first');
  const folderExists=d.folders.some(f=>f===selected);
  if(!folderExists)return toast('Selected folder not found');
  const affected=d.notes.filter(n=>(n.folder||'General')===selected);
  if(!confirm(`Delete only the selected folder "${selected}"? ${affected.length} item${affected.length===1?'':'s'} will be moved to General.`))return;
  (async()=>{
    try{
      for(const n of affected.filter(x=>x.type==='pdf'&&x.storage_path)){
        const parts=n.storage_path.split('/');
        const fileName=parts[parts.length-1];
        const newPath=`${parts[0]}/General/${fileName}`;
        const {error}=await supabaseClient.storage.from('pdfs').move(n.storage_path,newPath);
        if(error)throw error;
        n.storage_path=newPath;
      }
      affected.forEach(n=>{if((n.folder||'General')===selected)n.folder='General'});
      d.folders=d.folders.filter(f=>f!==selected);
      window.noteFolder='All';
      await save();
      toast(`Folder "${selected}" deleted ✓`);
      render();
    }catch(e){
      console.error('Folder delete error:',e);
      toast('Could not delete selected folder: '+(e.message||'Storage error'));
    }
  })();
}

async function getCurrentUser(){

function safeFileName(name){return String(name||"file.pdf").replace(/[^\w.\-() ]+/g,"_").replace(/\s+/g," ").slice(0,120)||"file.pdf";}
let pdfUploadState=null;
async function analyzePDF(file){
if(!window.pdfjsLib)throw new Error("PDF engine is still loading");
const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise,max=Math.min(pdf.numPages,5);let text='';
for(let i=1;i<=max;i++){let page=await pdf.getPage(i),content=await page.getTextContent();text+=' '+content.items.map(x=>x.str).join(' ')}
let lower=text.toLowerCase(),subject='General',type='Reference';
const rules=[['Physics',['physics','mechanics','electrostatics','optics','thermodynamics','current electricity','magnetism']],['Chemistry',['chemistry','organic chemistry','inorganic','physical chemistry','mole concept','reaction']],['Mathematics',['mathematics','maths','algebra','calculus','trigonometry','geometry','probability']],['Biology',['biology','botany','zoology','genetics','cell biology','human physiology']],['JEE',['jee main','jee advanced','engineering entrance']],['School',['class 10','class 11','class 12','cbse','board exam']]];
for(const [s,words] of rules)if(words.some(w=>lower.includes(w))){subject=s;break}
if(/question paper|question bank|previous year|pyq|sample paper/.test(lower))type='Question Paper';else if(/practice sheet|worksheet|dpp|assignment|exercise/.test(lower))type='Practice Sheet';else if(/revision|quick revision|short notes|formula sheet/.test(lower))type='Revision';else if(/notes|lecture notes|handwritten/.test(lower))type='Notes';else if(/module|chapter|unit|lesson/.test(lower))type='Book / Module';
let chapter='',cm=text.match(/(?:chapter|ch\.|unit|topic)\s*[-:]*\s*([A-Za-z0-9][A-Za-z0-9 .&()/-]{2,70})/i);if(cm)chapter=cm[1].trim().replace(/\s+/g,' ').slice(0,70);
return {pages:pdf.numPages,subject,type,chapter,tags:[...new Set([subject,type==='Question Paper'?'PYQ':'',chapter].filter(Boolean))]};
}
function closePDFMeta(){document.getElementById('pdfMetaModal').classList.remove('show');pdfUploadState=null}
async function uploadPDF(file){
if(!file)return;if(file.type!=="application/pdf"&&!/\.pdf$/i.test(file.name))return toast("Please select a PDF");if(file.size>50*1024*1024)return toast("PDF limit is 50 MB");const user=await getCurrentUser();if(!user)return toast("Please login first");
pdfUploadState={file,user};document.getElementById('pdfMetaFile').textContent=file.name;document.getElementById('pdfMetaModal').classList.add('show');document.getElementById('pdfSaveBtn').disabled=true;
try{let meta=await analyzePDF(file);pdfUploadState.meta=meta;document.getElementById('pdfTitle').value=file.name.replace(/\.pdf$/i,'');document.getElementById('pdfSubject').value=meta.subject;document.getElementById('pdfChapter').value=meta.chapter;document.getElementById('pdfType').value=meta.type;document.getElementById('pdfTags').value=meta.tags.join(', ');document.getElementById('pdfFolder').innerHTML=d.folders.map(f=>`<option>${esc(f)}</option>`).join('');document.getElementById('pdfFolder').value=(window.noteFolder&&window.noteFolder!=='All'&&d.folders.includes(window.noteFolder))?window.noteFolder:'General';document.getElementById('pdfAnalyzeStatus').innerHTML=`✅ Analyzed <b>${meta.pages} pages</b> • detected <b>${esc(meta.subject)}</b> • <b>${esc(meta.type)}</b>${meta.chapter?` • chapter/topic: <b>${esc(meta.chapter)}</b>`:''}`;document.getElementById('pdfSaveBtn').disabled=false}catch(e){console.error(e);document.getElementById('pdfAnalyzeStatus').textContent='Could not analyze; you can enter details manually.';pdfUploadState.meta={pages:0};document.getElementById('pdfTitle').value=file.name.replace(/\.pdf$/i,'');document.getElementById('pdfSubject').value='General';document.getElementById('pdfType').value='Reference';document.getElementById('pdfTags').value='';document.getElementById('pdfFolder').innerHTML=d.folders.map(f=>`<option>${esc(f)}</option>`).join('');document.getElementById('pdfSaveBtn').disabled=false}
}
async function confirmPDFUpload(){
if(!pdfUploadState)return;let {file,user,meta}=pdfUploadState,btn=document.getElementById('pdfSaveBtn');btn.disabled=true;btn.textContent='Uploading…';try{let fileName=safeFileName(file.name),folder=(document.getElementById('pdfFolder').value||'General').trim(),storagePath=`${user.id}/${folder}/${id()}-${fileName}`;let {error}=await supabaseClient.storage.from("pdfs").upload(storagePath,file,{cacheControl:"3600",upsert:false,contentType:"application/pdf"});if(error)throw error;let tags=document.getElementById('pdfTags').value.split(',').map(x=>x.trim()).filter(Boolean);d.notes.push({id:id(),type:"pdf",title:v('pdfTitle')||file.name.replace(/\.pdf$/i,''),subject:v('pdfSubject')||'General',chapter:v('pdfChapter'),document_type:document.getElementById('pdfType').value,tags:[...new Set(tags)],file:file.name,storage_path:storagePath,folder:document.getElementById('pdfFolder').value||'General',date:todayLocal(),size:file.size,pages:meta?.pages||0,created_at:new Date().toISOString()});await save();closePDFMeta();toast("PDF classified & saved to cloud ✓");render()}catch(e){console.error(e);toast("PDF upload failed: "+(e.message||"Check Storage bucket/policies"));btn.disabled=false;btn.textContent='☁ Save PDF'}
}
async function openPDF(noteId){
let n=d.notes.find(x=>x.id===noteId);if(!n)return;let user=await getCurrentUser();if(!user)return toast("Please login first");if(!n.storage_path)return toast("This PDF is from old storage. Upload it again.");
try{let {data,error}=await supabaseClient.storage.from("pdfs").createSignedUrl(n.storage_path,3600);if(error)throw error;if(!data?.signedUrl)return toast("Could not create PDF link");document.getElementById('pdfViewerTitle').textContent=n.title;document.getElementById('pdfViewerInfo').textContent=`${n.subject||'General'} • ${n.chapter||'Unclassified'} • ${n.pages||'?'} pages • ${n.document_type||'PDF'}`;document.getElementById('pdfViewerFrame').src=data.signedUrl;document.getElementById('pdfDownloadBtn').onclick=()=>{let a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener';a.click()};document.getElementById('pdfViewerModal').classList.add('show')}catch(e){console.error(e);toast("Could not open PDF: "+(e.message||"Storage error"))}
}

function editPDF(noteId){let n=d.notes.find(x=>x.id===noteId);if(!n)return;let title=prompt('PDF title:',n.title);if(title===null)return;let subject=prompt('Subject:',n.subject||'General');if(subject===null)return;let chapter=prompt('Chapter / topic:',n.chapter||'');if(chapter===null)return;let tags=prompt('Tags (comma separated):',(n.tags||[]).join(', '));if(tags===null)return;n.title=title.trim()||n.title;n.subject=subject.trim()||'General';n.chapter=chapter.trim();n.tags=tags.split(',').map(x=>x.trim()).filter(Boolean);save();toast('PDF information updated');render()}

async function deleteNote(noteId){
  if(!confirm("Delete this note?"))return;
  const n=d.notes.find(x=>x.id===noteId);if(!n)return;
  try{
    if(n.type==="pdf"&&n.storage_path){const {error}=await supabaseClient.storage.from("pdfs").remove([n.storage_path]);if(error)throw error;}
    d.notes=d.notes.filter(x=>x.id!==noteId);await save();toast("Deleted");render();
  }catch(e){console.error("PDF delete error:",e);toast("Could not delete PDF: "+(e.message||"Storage error"));}
}

function workout(a){a.innerHTML=`<div class="hero"><div><div class="eyebrow">Health break</div><h1>Workout</h1><p>Keep movement simple and consistent.</p></div></div><div class="card"><div class="row"><input class="input" id="wTitle" placeholder="Workout / walk"><input class="input" id="wMin" type="number" min="1" placeholder="Minutes"><button class="primary" onclick="addWorkout()">Add</button></div></div><div class="card"><h2>History</h2>${d.workouts.slice().reverse().map(w=>`<div class="item"><div class="item-row"><div class="item-main"><b>${esc(w.title)}</b><div class="item-sub">${w.date} • ${w.minutes} min</div></div><div class="actions"><button class="secondary" onclick="editWorkout('${w.id}')">Edit</button><button class="danger" onclick="delWorkout('${w.id}')">Delete</button></div></div></div>`).join('')||'<div class="empty">No workouts yet.</div>'}</div>`}
function addWorkout(){let title=v('wTitle'),min=+v('wMin');if(!title||!min)return toast('Workout and minutes required');d.workouts.push({id:id(),title,minutes:min,date:todayLocal()});save();toast('Workout added');render()}
function editWorkout(id){let x=d.workouts.find(w=>w.id===id);if(!x)return;let t=prompt('Workout:',x.title);if(t===null)return;let m=prompt('Minutes:',x.minutes);if(m===null)return;x.title=t.trim()||x.title;x.minutes=+m||x.minutes;save();render()}
function delWorkout(id){if(!confirm('Delete workout?'))return;d.workouts=d.workouts.filter(x=>x.id!==id);save();render()}
function goals(a){a.innerHTML=`<div class="hero"><div><div class="eyebrow">Long-term direction</div><h1>Goals</h1><p>Track outcomes beyond today’s individual targets.</p></div></div><div class="card"><div class="row"><input class="input" id="gTitle" placeholder="Goal e.g. Finish Physics backlog"><input class="input" id="gDate" type="date" value="${todayLocal()}"><select class="select" id="gCat"><option>JEE</option><option>Study</option><option>Personal</option><option>Other</option></select></div><div class="row"><input class="input" id="gProgress" type="number" min="0" max="100" value="0" placeholder="Progress %"><input class="input" id="gNote" placeholder="Optional milestone / note"><button class="primary" onclick="addGoal()">Add Goal</button></div></div><div class="card"><h2>My Goals</h2>${d.goals.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(g=>{let done=isDone('g-',g.id),p=done?100:(+g.progress||0);return `<div class="item"><div class="item-row"><button class="check ${done?'on':''}" onclick="toggleGoal('${g.id}')">${done?'✓':''}</button><div class="item-main"><div class="item-title ${done?'done':''}">${esc(g.title)} <span class="tag purple">${esc(g.cat)}</span></div><div class="item-sub">Due ${g.date} • ${p}%${g.note?' • '+esc(g.note):''}</div><div class="progress" style="height:7px;background:#14263d;margin:8px 0 0"><div style="height:100%;width:${p}%;background:#965cff;border-radius:9px"></div></div></div><div class="actions"><button class="secondary" onclick="editGoal('${g.id}')">Edit</button><button class="danger" onclick="delGoal('${g.id}')">Delete</button></div></div></div>`}).join('')||'<div class="empty">No goals yet.</div>'}</div>`}
function addGoal(){let title=v('gTitle'),date=v('gDate');if(!title||!date)return toast('Goal and date required');d.goals.push({id:id(),title,date,cat:v('gCat'),progress:Math.max(0,Math.min(100,+v('gProgress')||0)),note:v('gNote')});save();toast('Goal added');render()}
function toggleGoal(id){let g=d.goals.find(x=>x.id===id);if(!g)return;let done=!isDone('g-',id);setDone('g-',id,done);if(done)g.progress=100;save();toast(done?'Goal completed ✓':'Goal reopened');render()}
function editGoal(id){let g=d.goals.find(x=>x.id===id);if(!g)return;let t=prompt('Goal:',g.title);if(t===null)return;let date=prompt('Due date:',g.date);if(date===null)return;let p=prompt('Progress %:',g.progress||0);if(p===null)return;g.title=t.trim()||g.title;g.date=date.trim()||g.date;g.progress=Math.max(0,Math.min(100,+p||0));if(g.progress>=100)setDone('g-',id,true);save();render()}

function exportData(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Student-Life-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.targets||!x.classes)return toast('Invalid backup');localStorage.setItem(KEY,JSON.stringify(x));d=load();toast('Backup imported');go('home')}catch(e){toast('Could not import backup')}};r.readAsText(file)}
function resetData(){if(!confirm('This will permanently delete app data. Continue?'))return;localStorage.removeItem(KEY);d=load();toast('Data reset');go('home')}
function searchAll(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.innerHTML='';return}let r=[];d.targets.forEach(x=>{if((x.title+' '+x.subject).toLowerCase().includes(q))r.push({p:'study',t:'Target: '+x.title,s:x.subject})});d.classes.forEach(x=>{if((x.subject+' '+x.name).toLowerCase().includes(q))r.push({p:'classes',t:'Class: '+x.subject,s:x.name})});d.goals.forEach(x=>{if((x.title+' '+x.note).toLowerCase().includes(q))r.push({p:'challenge',t:'Goal: '+x.title,s:x.note})});d.notes.forEach(x=>{if((x.title+' '+x.subject+' '+x.text+' '+x.file).toLowerCase().includes(q))r.push({p:'notes',t:'Note: '+x.title,s:x.subject||x.file})});box.innerHTML=`<div class="search-results">${r.slice(0,8).map(x=>`<div class="search-result" onclick="go('${x.p}');document.getElementById('globalSearch').value='';document.getElementById('searchResults').innerHTML=''">${esc(x.t)}<small style="display:block;color:#7f93ae">${esc(x.s||'')}</small></div>`).join('')||'<div class="search-result">No matches</div>'}</div>`}
function v(id){return (document.getElementById(id)?.value||'').trim()} function checked(prefix){return days().map((_,i)=>document.getElementById(prefix+i)?.checked?i:null).filter(x=>x!==null)}
async function getCurrentUser(){
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    return data?.session?.user||null;
  }catch(e){console.error("Auth session error:",e);return null;}
}
function safeFileName(name){return String(name||"file.pdf").replace(/[^\w.\-() ]+/g,"_").replace(/\s+/g," ").slice(0,120)||"file.pdf";}
async function uploadPDF(file){
  if(!file)return;
  if(file.type!=="application/pdf")return toast("Please select a PDF");
  if(file.size>20*1024*1024)return toast("PDF limit is 20 MB");
  const user=await getCurrentUser();if(!user)return toast("Please login first");
  const fileName=safeFileName(file.name),storagePath=`${user.id}/${id()}-${fileName}`;
  toast("Uploading PDF...");
  try{
    const {error}=await supabaseClient.storage.from("pdfs").upload(storagePath,file,{cacheControl:"3600",upsert:false,contentType:"application/pdf"});
    if(error)throw error;
    const folder=(typeof window.noteFolder==='string'&&window.noteFolder!=="All"&&window.noteFolder.trim())?window.noteFolder.trim():"General";
    d.notes.push({id:id(),type:"pdf",title:file.name,subject:"",file:file.name,storage_path:storagePath,folder,date:todayLocal()});
    await save();toast("PDF uploaded to cloud ✓");render();
  }catch(e){console.error("PDF upload error:",e);toast("PDF upload failed: "+(e.message||"Check Storage bucket/policies"));}
}
async function openPDF(noteId){
  const n=d.notes.find(x=>x.id===noteId);if(!n)return;
  const user=await getCurrentUser();if(!user)return toast("Please login first");
  if(!n.storage_path)return toast("This PDF is from the old local storage. Upload it again to sync it.");
  try{
    const {data,error}=await supabaseClient.storage.from("pdfs").createSignedUrl(n.storage_path,600);
    if(error)throw error;if(!data?.signedUrl)return toast("Could not create PDF link");
    const w=window.open(data.signedUrl,"_blank");if(!w)toast("Popup blocked. Allow popups for this site.");
  }catch(e){console.error("PDF open error:",e);toast("Could not open PDF: "+(e.message||"Storage error"));}
}
async function deleteNote(noteId){
  if(!confirm("Delete this note?"))return;
  const n=d.notes.find(x=>x.id===noteId);if(!n)return;
  try{
    if(n.type==="pdf"&&n.storage_path){const {error}=await supabaseClient.storage.from("pdfs").remove([n.storage_path]);if(error)throw error;}
    d.notes=d.notes.filter(x=>x.id!==noteId);await save();toast("Deleted");render();
  }catch(e){console.error("PDF delete error:",e);toast("Could not delete PDF: "+(e.message||"Storage error"));}
}
go('home');
